<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#10b981">
<title>دفتر الديون Pro | الإصدار الاحترافي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --primary:#10b981; --primary-dark:#059669; --primary-light:#ecfdf5;
  --danger:#ef4444; --danger-light:#fef2f2;
  --warning:#f59e0b; --warning-light:#fffbeb;
  --info:#3b82f6; --info-light:#eff6ff;
  --bg:#f8fafc; --card:#ffffff; --text:#0f172a; --text-muted:#64748b;
  --border:#e2e8f0; --shadow:0 4px 6px -1px rgba(0,0,0,.05),0 2px 4px -1px rgba(0,0,0,.03);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.05),0 4px 6px -2px rgba(0,0,0,.025);
  --radius:16px; --radius-sm:12px;
}
[data-theme="dark"]{
  --primary:#34d399; --primary-dark:#10b981; --primary-light:#064e3b;
  --danger:#f87171; --danger-light:#7f1d1d;
  --warning:#fbbf24; --warning-light:#78350f;
  --info:#60a5fa; --info-light:#1e3a8a;
  --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --text-muted:#94a3b8;
  --border:#334155; --shadow:0 4px 6px -1px rgba(0,0,0,.3);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:90px}
.hidden{display:none!important}

/* Header */
.header{position:sticky;top:0;z-index:100;background:var(--card);box-shadow:var(--shadow);padding:12px 16px}
.header-inner{display:flex;justify-content:space-between;align-items:center;max-width:900px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:800}
.logo b{color:var(--primary)}
.icon-btn{width:42px;height:42px;border:none;border-radius:12px;background:var(--bg);color:var(--text);font-size:20px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center}
.icon-btn:active{transform:scale(.9)}

/* Main */
.main{max-width:900px;margin:0 auto;padding:16px}
.screen{animation:fadeIn .3s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Cards */
.card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px;border:1px solid var(--border)}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--border);position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--primary)}
.stat-card.danger::before{background:var(--danger)}
.stat-card.warning::before{background:var(--warning)}
.stat-card.info::before{background:var(--info)}
.stat-label{font-size:13px;color:var(--text-muted);margin-bottom:8px;font-weight:600}
.stat-value{font-size:20px;font-weight:800;color:var(--text);line-height:1.3}
.stat-value.danger{color:var(--danger)}
.stat-value.success{color:var(--primary)}
.stat-sub{font-size:12px;color:var(--text-muted);margin-top:6px;font-weight:600}

/* Buttons */
.btn{border:none;border-radius:12px;padding:12px 18px;font-family:'Cairo';font-size:14px;font-weight:700;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(16,185,129,.3)}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.btn-wa{background:#25D366;color:#fff;box-shadow:0 4px 12px rgba(37,211,102,.3)}
.btn-block{width:100%}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:10px}

/* Section Title */
.section-header{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px}
.section-title{font-size:18px;font-weight:800}

/* Customer Card */
.customer-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px;cursor:pointer;border:1px solid var(--border);transition:.2s}
.customer-card:active{transform:scale(.98);border-color:var(--primary)}
.customer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.customer-name{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.customer-amount{font-weight:800;font-size:16px;color:var(--danger);text-align:left;line-height:1.4}
.customer-amount.paid{color:var(--primary)}
.customer-meta{display:flex;gap:12px;font-size:12px;color:var(--text-muted);margin-top:8px}

/* Badges */
.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge-regular{background:var(--primary-light);color:var(--primary-dark)}
.badge-late{background:var(--warning-light);color:var(--warning)}
.badge-blacklist{background:var(--danger-light);color:var(--danger)}
.badge-usd{background:var(--info-light);color:var(--info)}
.badge-lbp{background:var(--warning-light);color:var(--warning)}

/* Progress */
.progress{height:8px;background:var(--bg);border-radius:10px;overflow:hidden;margin-top:12px}
.progress-bar{height:100%;background:var(--primary);border-radius:10px;transition:width .5s ease}

/* Debt Item */
.debt-item{background:var(--card);border-radius:var(--radius-sm);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);border-right:4px solid var(--primary);border-top:1px solid var(--border);border-left:1px solid var(--border);border-bottom:1px solid var(--border)}
.debt-item.overdue{border-right-color:var(--danger)}
.debt-item.paid{border-right-color:var(--text-muted);opacity:.8}
.debt-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.debt-desc{font-weight:800;font-size:15px}
.debt-amount{font-weight:800;font-size:15px;color:var(--danger)}
.debt-info{display:flex;gap:12px;font-size:12px;color:var(--text-muted);margin-bottom:10px;flex-wrap:wrap}
.debt-actions{display:flex;gap:8px;flex-wrap:wrap}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);box-shadow:0 -4px 12px rgba(0,0,0,.05);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:100;border-top:1px solid var(--border)}
.nav-btn{flex:1;border:none;background:none;color:var(--text-muted);padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:'Cairo';transition:.2s;border-radius:10px}
.nav-btn.active{color:var(--primary)}
.nav-icon{font-size:22px}
.nav-label{font-size:11px;font-weight:700}
.nav-badge{position:absolute;top:4px;right:calc(50% - 18px);background:var(--danger);color:#fff;font-size:10px;min-width:18px;height:18px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800}

/* Modals & Forms */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);border-radius:24px 24px 0 0;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;padding:24px 20px calc(24px + env(safe-area-inset-bottom));animation:slideUp .3s cubic-bezier(0.4, 0, 0.2, 1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.modal-handle{width:40px;height:5px;background:var(--border);border-radius:5px;margin:-10px auto 20px}
.modal-title{font-size:20px;font-weight:800;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}
.modal-close{width:36px;height:36px;border:none;border-radius:50%;background:var(--bg);color:var(--text);font-size:18px;cursor:pointer}

.form-group{margin-bottom:16px}
.form-label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}
.form-input,.form-select,.form-textarea{width:100%;padding:14px;border:2px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);font-family:'Cairo';font-size:14px;transition:.2s;font-weight:600}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--primary);background:var(--card)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row-3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
.form-actions{display:flex;gap:12px;margin-top:24px}
.form-actions .btn{flex:1}

/* Charts */
.chart-box{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:16px;border:1px solid var(--border)}
.chart-box h3{font-size:15px;font-weight:800;margin-bottom:16px}
.chart-wrap{position:relative;height:220px}

/* Empty State */
.empty{text-align:center;padding:60px 20px;color:var(--text-muted)}
.empty-icon{font-size:64px;margin-bottom:16px;opacity:.5}
.empty h3{font-size:18px;margin-bottom:8px;color:var(--text)}

/* Search */
.search-input{width:100%;padding:14px 18px;border:2px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);font-family:'Cairo';font-size:14px;font-weight:600}
.search-input:focus{outline:none;border-color:var(--primary)}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--card);padding:12px 24px;border-radius:12px;font-size:14px;font-weight:700;z-index:9999;box-shadow:var(--shadow-lg);animation:toastIn .3s}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-20px)}to{opacity:1;transform:translate(-50%,0)}}

/* Print */
.print-area{display:none}
@media print{
  body>*{display:none!important}
  .print-area{display:block!important;padding:20px;font-family:'Cairo'}
  .print-header{text-align:center;border-bottom:2px solid #10b981;padding-bottom:16px;margin-bottom:20px}
  .print-header h1{font-size:24px;color:#10b981}
  .print-table{width:100%;border-collapse:collapse;margin:16px 0}
  .print-table th,.print-table td{border:1px solid #cbd5e1;padding:10px;text-align:right;font-size:14px}
  .print-table th{background:#f8fafc;font-weight:800}
  .print-total{background:#10b981;color:#fff;font-weight:800}
}
</style>
</head>
<body>

<div id="app">
  <header class="header">
    <div class="header-inner">
      <div class="logo"><span>💰</span> دفتر الديون <b>Pro</b></div>
      <div>
        <button class="icon-btn" id="themeBtn">🌙</button>
      </div>
    </div>
  </header>
  
  <main id="mainContent" class="main"></main>
  
  <nav class="bottom-nav">
    <button class="nav-btn active" data-screen="dashboard"><span class="nav-icon">📊</span><span class="nav-label">الرئيسية</span></button>
    <button class="nav-btn" data-screen="customers"><span class="nav-icon">👥</span><span class="nav-label">الزبائن</span></button>
    <button class="nav-btn" data-screen="reminders"><span class="nav-icon">🔔</span><span class="nav-label">التنبيهات</span><span class="nav-badge hidden" id="reminderBadge">0</span></button>
    <button class="nav-btn" data-screen="settings"><span class="nav-icon">⚙️</span><span class="nav-label">الإعدادات</span></button>
  </nav>
</div>

<div id="modalRoot"></div>
<div id="printArea" class="print-area"></div>

<script>
(function(){
'use strict';

const STORAGE_KEY = 'daftar_diyoun_pro_v3';
const USD = 'USD';
const LBP = 'LBP';

// إضافة إعدادات المحل هنا
const defaultData = () => ({
  customers: [],
  settings: { 
    exchangeRate: 89500, 
    darkMode: false, 
    reminderDays: 3,
    shopName: '',
    shopPhone: ''
  }
});

let DB = loadDB();
let currentScreen = 'dashboard';
let currentCustomerId = null;
let searchQuery = '';
let chart1 = null, chart2 = null;

function loadDB(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultData();
    const p = JSON.parse(raw);
    return { customers:p.customers||[], settings:{...defaultData().settings, ...(p.settings||{})} };
  } catch(e){ return defaultData(); }
}
function saveDB(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function fmt(n){ return (Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:2}); }
function rate(){ return Number(DB.settings.exchangeRate) || 89500; }

// Currency Helpers
function getCurSymbol(c){ return c === USD ? '$' : 'ل.ل'; }
function fmtCur(amt, cur){ return cur === USD ? '$' + fmt(amt) : fmt(amt) + ' ل.ل'; }
function toUSD(amt, cur){ return cur === LBP ? amt / rate() : amt; }
function toLBP(amt, cur){ return cur === USD ? amt * rate() : amt; }

// Debt Calculations
const dTotal = d => Number(d.amount)||0;
const dPaid  = d => Number(d.paid)||0;
const dRem   = d => Math.max(0, dTotal(d)-dPaid(d));
const isPaid = d => dRem(d) <= 0;
const isOverdue = d => !isPaid(d) && d.dueDate && new Date(d.dueDate) < new Date(new Date().toDateString());
const isUpcoming = (d, days) => {
  if(isPaid(d) || !d.dueDate) return false;
  const diff = Math.ceil((new Date(d.dueDate) - new Date(new Date().toDateString()))/(86400000));
  return diff >= 0 && diff <= days;
};

// Customer Calculations
const cRemUSD = c => c.debts.reduce((s,d)=>s+toUSD(dRem(d), d.currency||USD),0);
const cRemLBP = c => c.debts.reduce((s,d)=>s+toLBP(dRem(d), d.currency||USD),0);
const cPaidUSD = c => c.debts.reduce((s,d)=>s+toUSD(dPaid(d), d.currency||USD),0);
const cTotalUSD = c => c.debts.reduce((s,d)=>s+toUSD(dTotal(d), d.currency||USD),0);

function allCustomers(){ return DB.customers.filter(c=>!c.archived); }
function findC(id){ return DB.customers.find(c=>c.id===id); }

function reminderCount(){
  const days = DB.settings.reminderDays||3;
  let n = 0;
  allCustomers().forEach(c => c.debts.forEach(d => {
    if(isOverdue(d) || isUpcoming(d, days)) n++;
  }));
  return n;
}

function init(){
  applyTheme();
  document.getElementById('themeBtn').onclick = ()=>{
    DB.settings.darkMode = !DB.settings.darkMode; saveDB(); applyTheme();
  };
  document.querySelectorAll('.nav-btn').forEach(btn=>{
    btn.onclick = ()=>{ currentScreen = btn.dataset.screen; currentCustomerId=null; render(); };
  });
  render();
}

function applyTheme(){
  document.documentElement.setAttribute('data-theme', DB.settings.darkMode?'dark':'light');
  document.getElementById('themeBtn').textContent = DB.settings.darkMode?'☀️':'🌙';
}

function render(){
  document.querySelectorAll('.nav-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.screen===currentScreen && !currentCustomerId);
  });
  const n = reminderCount();
  const badge = document.getElementById('reminderBadge');
  if(n>0){ badge.textContent = n; badge.classList.remove('hidden'); }
  else badge.classList.add('hidden');

  const main = document.getElementById('mainContent');
  if(currentCustomerId) return renderCustomerDetail(main);
  switch(currentScreen){
    case 'dashboard': return renderDashboard(main);
    case 'customers': return renderCustomers(main);
    case 'reminders': return renderReminders(main);
    case 'settings': return renderSettings(main);
  }
}

/* ==================== DASHBOARD ==================== */
function renderDashboard(el){
  const cs = allCustomers();
  const remUSD = cs.reduce((s,c)=>s+cRemUSD(c),0);
  const remLBP = cs.reduce((s,c)=>s+cRemLBP(c),0);
  const paidUSD = cs.reduce((s,c)=>s+cPaidUSD(c),0);
  const totalUSD = cs.reduce((s,c)=>s+cTotalUSD(c),0);
  const overdue = cs.reduce((s,c)=>s+c.debts.filter(isOverdue).length,0);
  const active = cs.filter(c=>cRemUSD(c)>0.01 || cRemLBP(c)>1).length;

  el.innerHTML = `
    <div class="screen">
      <div style="text-align:center;margin-bottom:16px;font-size:13px;font-weight:700;color:var(--text-muted)">
        💵 سعر الصرف: 1$ = ${fmt(rate())} ل.ل
      </div>
      <div class="stat-grid">
        <div class="stat-card danger">
          <div class="stat-label">المتبقي (دولار)</div>
          <div class="stat-value danger">${fmtCur(remUSD, USD)}</div>
          <div class="stat-sub">= ${fmtCur(remLBP, LBP)}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">إجمالي المسدد</div>
          <div class="stat-value success">${fmtCur(paidUSD, USD)}</div>
          <div class="stat-sub">من أصل ${fmtCur(totalUSD, USD)}</div>
        </div>
        <div class="stat-card warning">
          <div class="stat-label">ديون متأخرة</div>
          <div class="stat-value">${overdue}</div>
          <div class="stat-sub">تحتاج متابعة</div>
        </div>
        <div class="stat-card info">
          <div class="stat-label">زبائن نشطين</div>
          <div class="stat-value">${active}</div>
          <div class="stat-sub">من أصل ${cs.length} مسجلين</div>
        </div>
      </div>

      <!-- زر تقرير المحل الجديد -->
      <button class="btn btn-wa btn-block" id="shopReportBtn" style="margin-bottom:16px">📤 إرسال تقرير المحل للمالك</button>

      <div class="chart-box">
        <h3>نسبة التحصيل (بالدولار)</h3>
        <div class="chart-wrap"><canvas id="c1"></canvas></div>
      </div>

      <div class="chart-box">
        <h3>أعلى 5 زبائن مديونية</h3>
        <div class="chart-wrap"><canvas id="c2"></canvas></div>
      </div>

      <button class="btn btn-primary btn-block" id="addBtn" style="margin-top:8px">➕ إضافة زبون جديد</button>
    </div>`;

  document.getElementById('addBtn').onclick = ()=>openCustomerModal();
  document.getElementById('shopReportBtn').onclick = ()=>sendShopReport();

  if(chart1) chart1.destroy();
  const dctx = document.getElementById('c1');
  if(totalUSD>0){
    chart1 = new Chart(dctx, {
      type:'doughnut',
      data:{ labels:['مسدد','متبقي'], datasets:[{data:[paidUSD,remUSD], backgroundColor:['#10b981','#ef4444'], borderWidth:0}] },
      options:{responsive:true,maintainAspectRatio:false,cutout:'70%',plugins:{legend:{position:'bottom',labels:{font:{family:'Cairo',weight:'bold'}}}}}
    });
  } else dctx.parentElement.innerHTML = '<div class="empty"><h3>لا توجد بيانات</h3></div>';

  if(chart2) chart2.destroy();
  const top = [...cs].map(c=>({name:c.name,val:cRemUSD(c)})).filter(x=>x.val>0.01).sort((a,b)=>b.val-a.val).slice(0,5);
  const tctx = document.getElementById('c2');
  if(top.length){
    chart2 = new Chart(tctx, {
      type:'bar',
      data:{ labels:top.map(t=>t.name), datasets:[{label:'المتبقي ($)', data:top.map(t=>t.val), backgroundColor:'#10b981', borderRadius:6}] },
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{display:false}},x:{grid:{display:false},ticks:{font:{family:'Cairo'}}}}}
    });
  } else tctx.parentElement.innerHTML = '<div class="empty"><h3>لا توجد ديون</h3></div>';
}

/* ==================== CUSTOMERS ==================== */
function renderCustomers(el){
  let list = allCustomers();
  if(searchQuery) list = list.filter(c => c.name.includes(searchQuery) || (c.phone||'').includes(searchQuery));
  list.sort((a,b)=>cRemUSD(b)-cRemUSD(a));

  el.innerHTML = `
    <div class="screen">
      <div class="section-header">
        <div class="section-title">الزبائن (${list.length})</div>
        <button class="btn btn-primary btn-sm" id="addBtn">➕ زبون</button>
      </div>
      <input class="search-input" id="search" placeholder="🔍 ابحث بالاسم أو الهاتف..." value="${searchQuery}" style="margin-bottom:16px">
      
      <div id="list">
        ${list.length ? list.map(customerCardHTML).join('') : '<div class="empty"><div class="empty-icon">👥</div><h3>لا يوجد زبائن</h3></div>'}
      </div>
    </div>`;

  document.getElementById('addBtn').onclick = ()=>openCustomerModal();
  const si = document.getElementById('search');
  si.oninput = e => { searchQuery = e.target.value; renderCustomers(el); setTimeout(()=>{const s=document.getElementById('search'); if(s){s.focus();s.setSelectionRange(s.value.length,s.value.length);}},0); };
  el.querySelectorAll('[data-c]').forEach(x => x.onclick = ()=>{ currentCustomerId = x.dataset.c; render(); });
}

function customerCardHTML(c){
  const remUSD = cRemUSD(c), remLBP = cRemLBP(c);
  const paidUSD = cPaidUSD(c), totalUSD = cTotalUSD(c);
  const pct = totalUSD>0 ? Math.round(paidUSD/totalUSD*100) : 0;
  const hasOver = c.debts.some(isOverdue);
  const isSettled = remUSD <= 0.01 && remLBP <= 1;

  return `
    <div class="customer-card" data-c="${c.id}">
      <div class="customer-head">
        <div>
          <div class="customer-name">
            ${escapeHtml(c.name)}
            ${hasOver ? '<span class="badge badge-blacklist">متأخر</span>' : ''}
          </div>
          ${c.phone ? `<div class="customer-meta"><span>📞 ${escapeHtml(c.phone)}</span></div>` : ''}
        </div>

function debtHTML(d){
  const curr = d.currency || USD;
  const rem = dRem(d), tot = dTotal(d), paid = dPaid(d);
  const pct = tot>0 ? Math.round(paid/tot*100) : 0;
  const paidOff = isPaid(d);
  const over = isOverdue(d);
  const due = d.dueDate ? new Date(d.dueDate).toLocaleDateString('ar-EG') : '—';
  const badgeCur = curr === USD ? '<span class="badge badge-usd">دولار $</span>' : '<span class="badge badge-lbp">ليرة ل.ل</span>';

  return `
    <div class="debt-item ${over?'overdue':''} ${paidOff?'paid':''}">
      <div class="debt-head">
        <div class="debt-desc">${escapeHtml(d.description||'دين')} ${badgeCur}</div>
        <div class="debt-amount">${paidOff?'✓ مسدد':fmtCur(rem, curr)}</div>
      </div>
      <div class="debt-info">
        <span>💰 ${fmtCur(tot, curr)}</span>
        <span>✅ ${fmtCur(paid, curr)}</span>
        <span>📅 ${due}</span>
        ${over ? '<span class="badge badge-blacklist">متأخر</span>' : ''}
      </div>
      <div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div>
      <div class="debt-actions" style="margin-top:12px">
        ${!paidOff ? `<button class="btn btn-primary btn-sm" data-pay="${d.id}">💵 دفعة</button>` : ''}
        <button class="btn btn-ghost btn-sm" data-edit="${d.id}">✏️ تعديل</button>
        <button class="btn btn-ghost btn-sm" data-del="${d.id}">🗑️</button>
      </div>
    </div>`;
}

/* ==================== REMINDERS ==================== */
function renderReminders(el){
  const days = DB.settings.reminderDays||3;
  const over = [], soon = [];
  allCustomers().forEach(c=>{
    c.debts.forEach(d=>{
      if(isOverdue(d)) over.push({c,d});
      else if(isUpcoming(d, days)) soon.push({c,d});
    });
  });

  el.innerHTML = `
    <div class="screen">
      <div class="section-title" style="margin-bottom:16px">🔔 التنبيهات</div>
      
      <div class="stat-grid">
        <div class="stat-card danger"><div class="stat-label">ديون متأخرة</div><div class="stat-value">${over.length}</div></div>
        <div class="stat-card warning"><div class="stat-label">تستحق قريباً</div><div class="stat-value">${soon.length}</div></div>
      </div>

      <div class="section-header"><div class="section-title">⏰ متأخرة</div></div>
      ${over.length ? over.map(({c,d})=>remCardHTML(c,d,true)).join('') : '<div class="empty"><h3>لا توجد ديون متأخرة</h3></div>'}

      <div class="section-header" style="margin-top:24px"><div class="section-title">📅 قريبة الاستحقاق</div></div>
      ${soon.length ? soon.map(({c,d})=>remCardHTML(c,d,false)).join('') : '<div class="empty"><h3>لا توجد ديون قريبة</h3></div>'}
    </div>`;

  el.querySelectorAll('[data-c]').forEach(x => x.onclick = ()=>{ currentCustomerId = x.dataset.c; render(); });
}

function remCardHTML(c, d, over){

          <div class="customer-name">${escapeHtml(c.name)} ${over?'<span class="badge badge-blacklist">متأخر</span>':'<span class="badge badge-late">قريب</span>'}</div>
          <div class="customer-meta"><span>📝 ${escapeHtml(d.description||'دين')}</span><span>📅 ${new Date(d.dueDate).toLocaleDateString('ar-EG')}</span></div>

function showModal(title, html){

}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; document.body.style.overflow=''; }

  let p = ph.replace(/\D/g,'');
  if(p.startsWith('0')) p = '961' + p.substring(1); // كود لبنان

}

// دالة بناء الرسالة والإرسال
function sendCustomerMsg(c, phoneStr) {
  const remUSD = cRemUSD(c), remLBP = cRemLBP(c);
  let msg = `*كشف حساب - ${DB.settings.shopName || 'دفتر الديون'}* 💰\n\n`;
  msg += `أهلاً *${c.name}* 👋\n`;
  msg += `بتاريخ: ${new Date().toLocaleDateString('ar-EG')}\n`;
  msg += `سعر الصرف: 1$ = ${fmt(rate())} ل.ل\n\n`;
  
  if(c.debts.length === 0) msg += `لا توجد ديون مسجلة.`;
  else {
    msg += `*تفاصيل الديون:*\n--------------------\n`;
    c.debts.forEach((d,i)=>{
      const cur = d.currency || USD;
      msg += `${i+1}. ${d.description||'دين'} (${getCurSymbol(cur)}):\n`;
      msg += `   المتبقي: *${fmtCur(dRem(d), cur)}*\n`;
      msg += `--------------------\n`;
    });
    msg += `\n📌 *إجمالي المتبقي:*\n`;
    msg += `بالدولار: *${fmtCur(remUSD, USD)}*\n`;
    msg += `بالليرة: *${fmtCur(remLBP, LBP)}*\n\n`;
  }
  msg += `شكراً لتعاملك معنا! 🌹`;

  const url = phoneStr ? `https://wa.me/${phoneStr}?text=${encodeURIComponent(msg)}` : `https://wa.me/?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
  closeModal();
}

// إرسال تقرير المحل الشامل
function sendShopReport() {
  if(!DB.settings.shopPhone) {
    toast('⚠️ يرجى إدخال رقم المحل في الإعدادات أولاً');
    return;
  }
  
  const cs = allCustomers();
  const remUSD = cs.reduce((s,c)=>s+cRemUSD(c),0);
  const remLBP = cs.reduce((s,c)=>s+cRemLBP(c),0);
  
  let msg = `*تقرير المحل الشامل* 🏪\n`;
  msg += `المحل: *${DB.settings.shopName || 'غير محدد'}*\n`;
  msg += `التاريخ: ${new Date().toLocaleDateString('ar-EG')}\n`;
  msg += `سعر الصرف: 1$ = ${fmt(rate())} ل.ل\n\n`;
  
  msg += `📌 *الملخص المالي:*\n`;
  msg += `إجمالي الديون المتبقية:\n`;
  msg += `بالدولار: *${fmtCur(remUSD, USD)}*\n`;
  msg += `بالليرة: *${fmtCur(remLBP, LBP)}*\n\n`;
  
  msg += `👥 *تفاصيل الزبائن المديونين:*\n`;
  msg += `--------------------\n`;
  
  let count = 0;
  cs.forEach(c => {
    const cRemUSD = cRemUSDVal(c);
    if(cRemUSD > 0.01) {
      count++;
      msg += `${count}. *${c.name}*: ${fmtCur(cRemUSDVal(c), USD)} (ما يعادل ${fmtCur(cRemLBPVal(c), LBP)})\n`;
    }
  });
  
  if(count === 0) msg += `لا توجد ديون متبقية حالياً.`;

  const phone = cleanPhone(DB.settings.shopPhone);
  const url = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
}

// دوال مساعدة لحساب المبالغ (لتجنب تكرار الكود)
function cRemUSDVal(c) { return c.debts.reduce((s,d)=>s+toUSD(dRem(d), d.currency||USD),0); }
function cRemLBPVal(c) { return c.debts.reduce((s,d)=>s+toLBP(dRem(d), d.currency||USD),0); }

function printStatement(cId){
  const c = findC(cId); if(!c) return;
  const remUSD = cRemUSD(c), remLBP = cRemLBP(c);
  const paidUSD = cPaidUSD(c), totalUSD = cTotalUSD(c);
  
  const rows = c.debts.map(d=>{
    const cur = d.currency || USD;
    return `<tr>
      <td>${escapeHtml(d.description||'—')} (${getCurSymbol(cur)})</td>
      <td>${fmtCur(dTotal(d), cur)}</td>
      <td>${fmtCur(dPaid(d), cur)}</td>
      <td>${fmtCur(dRem(d), cur)}</td>
      <td>${d.dueDate?new Date(d.dueDate).toLocaleDateString('ar-EG'):'—'}</td>
    </tr>`;
  }).join('');

  document.getElementById('printArea').innerHTML = `
    <div class="print-header">
      <h1>💰 ${DB.settings.shopName || 'كشف حساب'}</h1>
      <p>التاريخ: ${new Date().toLocaleDateString('ar-EG')} | سعر الصرف: ${fmt(rate())} ل.ل</p>
    </div>
    <p style="margin-bottom:16px"><b>الزبون:</b> ${escapeHtml(c.name)} ${c.phone?'| '+escapeHtml(c.phone):''}</p>
    <table class="print-table">
      <thead><tr><th>البيان</th><th>المبلغ</th><th>المسدد</th><th>المتبقي</th><th>الاستحقاق</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" style="text-align:center">لا توجد ديون</td></tr>'}</tbody>
      <tfoot>
        <tr class="print-total"><td>الإجمالي ($)</td><td>${fmtCur(totalUSD, USD)}</td><td>${fmtCur(paidUSD, USD)}</td><td>${fmtCur(remUSD, USD)}</td><td></td></tr>
        <tr class="print-total"><td>المتبقي (ل.ل)</td><td colspan="3" style="text-align:center">${fmtCur(remLBP, LBP)}</td><td></td></tr>
      </tfoot>
    </table>
    <div style="text-align:center;margin-top:24px;font-size:12px;color:#64748b">دفتر الديون Pro</div>`;
  window.print();
}

function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>{t.style.opacity='0'; t.style.transition='.3s'; setTimeout(()=>t.remove(),300);},2000); }

init();
})();
</script>
</body>
</html>
