<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#10b981">
<title>دفتر الديون Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --primary:#10b981;--primary-dark:#059669;--primary-light:#d1fae5;
  --danger:#ef4444;--warning:#f59e0b;--info:#3b82f6;
  --bg:#f3f4f6;--card:#ffffff;--text:#1f2937;--text-muted:#6b7280;
  --border:#e5e7eb;--shadow:0 4px 20px rgba(0,0,0,.08);--shadow-lg:0 10px 40px rgba(0,0,0,.15);
  --radius:16px;--radius-sm:10px;
}
[data-theme="dark"]{
  --primary:#34d399;--primary-dark:#10b981;--primary-light:#064e3b;
  --bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--text-muted:#94a3b8;
  --border:#334155;--shadow:0 4px 20px rgba(0,0,0,.4);--shadow-lg:0 10px 40px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;transition:background .3s,color .3s;padding-bottom:88px}
.hidden{display:none!important}

/* ===== HEADER ===== */
.header{position:sticky;top:0;z-index:100;background:var(--card);
  box-shadow:0 2px 12px rgba(0,0,0,.06);padding:12px 16px}
.header-inner{display:flex;justify-content:space-between;align-items:center;max-width:900px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800}
.logo b{color:var(--primary)}
.logo-icon{font-size:24px}
.header-actions{display:flex;gap:8px}
.icon-btn{width:40px;height:40px;border:none;border-radius:12px;background:var(--bg);
  font-size:18px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center}
.icon-btn:active{transform:scale(.92)}

/* ===== MAIN ===== */
.main{max-width:900px;margin:0 auto;padding:16px}
.screen{animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== CARDS ===== */
.card{background:var(--card);border-radius:var(--radius);padding:16px;
  box-shadow:var(--shadow);margin-bottom:12px}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);
  position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--primary)}
.stat-card.danger::before{background:var(--danger)}
.stat-card.warning::before{background:var(--warning)}
.stat-card.info::before{background:var(--info)}
.stat-label{font-size:12px;color:var(--text-muted);margin-bottom:6px;font-weight:600}
.stat-value{font-size:18px;font-weight:800;color:var(--text)}
.stat-value.danger{color:var(--danger)}
.stat-value.success{color:var(--primary)}
.stat-sub{font-size:11px;color:var(--text-muted);margin-top:4px}

/* ===== SECTION HEADER ===== */
.section-header{display:flex;justify-content:space-between;align-items:center;
  margin:8px 0 12px;gap:8px}
.section-title{font-size:17px;font-weight:800}
.btn{border:none;border-radius:12px;padding:10px 16px;font-family:inherit;font-size:14px;
  font-weight:700;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;
  gap:6px;justify-content:center}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:var(--bg);color:var(--text)}
.btn-sm{padding:8px 12px;font-size:13px}
.btn-block{width:100%}
.btn-icon{width:36px;height:36px;padding:0;border-radius:10px}
.btn-wa{background:#dcfce7;color:#166534}

/* ===== SEARCH / FILTER ===== */
.search-box{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.search-input{flex:1;min-width:200px;padding:12px 16px;border:2px solid var(--border);
  border-radius:12px;background:var(--card);color:var(--text);font-family:inherit;font-size:14px;
  transition:.2s}
.search-input:focus{outline:none;border-color:var(--primary)}
.chip{padding:8px 14px;border-radius:20px;border:2px solid var(--border);background:var(--card);
  color:var(--text-muted);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
  transition:.15s;white-space:nowrap}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ===== CUSTOMER CARD ===== */
.customer-card{background:var(--card);border-radius:var(--radius);padding:16px;
  box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer;transition:.15s;
  border:2px solid transparent;position:relative}
.customer-card:active{transform:scale(.99);border-color:var(--primary)}
.customer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.customer-name{font-weight:800;font-size:16px;color:var(--text);display:flex;align-items:center;
  gap:6px;flex-wrap:wrap}
.customer-amount{font-weight:800;font-size:15px;color:var(--danger);white-space:nowrap;text-align:left}
.customer-amount.paid{color:var(--primary)}
.customer-meta{display:flex;gap:12px;font-size:12px;color:var(--text-muted);margin-top:6px}
.customer-meta span{display:flex;align-items:center;gap:4px}

.badge{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700}
.badge-regular{background:#d1fae5;color:#059669}
.badge-late{background:#fef3c7;color:#d97706}
.badge-blacklist{background:#fee2e2;color:#dc2626}
.badge-overdue{background:#fee2e2;color:#dc2626}
.badge-paid{background:#d1fae5;color:#059669}
.badge-usd{background:#e0f2fe;color:#0369a1}
.badge-lbp{background:#fef3c7;color:#b45309}
[data-theme="dark"] .badge-regular{background:#064e3b;color:#34d399}
[data-theme="dark"] .badge-late{background:#78350f;color:#fbbf24}
[data-theme="dark"] .badge-blacklist{background:#7f1d1d;color:#fca5a5}
[data-theme="dark"] .badge-overdue{background:#7f1d1d;color:#fca5a5}
[data-theme="dark"] .badge-paid{background:#064e3b;color:#34d399}
[data-theme="dark"] .badge-usd{background:#0c4a6e;color:#7dd3fc}
[data-theme="dark"] .badge-lbp{background:#78350f;color:#fbbf24}

/* ===== PROGRESS BAR ===== */
.progress{height:8px;background:var(--bg);border-radius:8px;overflow:hidden;margin-top:8px}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--primary),#34d399);
  border-radius:8px;transition:width .4s}

/* ===== DEBT ROW ===== */
.debt-item{background:var(--card);border-radius:var(--radius-sm);padding:14px;
  margin-bottom:10px;box-shadow:var(--shadow);border-right:4px solid var(--primary)}
.debt-item.overdue{border-right-color:var(--danger)}
.debt-item.paid{border-right-color:var(--text-muted);opacity:.7}
.debt-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.debt-desc{font-weight:700;font-size:14px;flex:1}
.debt-amount{font-weight:800;font-size:14px;color:var(--danger)}
.debt-item.paid .debt-amount{color:var(--primary)}
.debt-info{display:flex;gap:12px;font-size:12px;color:var(--text-muted);margin-bottom:8px;flex-wrap:wrap}
.debt-actions{display:flex;gap:6px;flex-wrap:wrap}

/* ===== EMPTY ===== */
.empty{text-align:center;padding:48px 20px;color:var(--text-muted)}
.empty-icon{font-size:56px;margin-bottom:12px;opacity:.6}
.empty h3{font-size:16px;margin-bottom:4px;color:var(--text)}
.empty p{font-size:13px}

/* ===== BOTTOM NAV ===== */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);
  box-shadow:0 -2px 20px rgba(0,0,0,.08);display:flex;justify-content:space-around;
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:100;max-width:100%}
.nav-btn{flex:1;border:none;background:none;color:var(--text-muted);padding:6px 4px;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-family:inherit;transition:.15s;position:relative;border-radius:10px}
.nav-btn.active{color:var(--primary)}
.nav-btn.active .nav-icon{transform:scale(1.15)}
.nav-icon{font-size:20px;transition:.15s}
.nav-label{font-size:10px;font-weight:700}
.nav-badge{position:absolute;top:2px;right:calc(50% - 20px);background:var(--danger);color:#fff;
  font-size:10px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;padding:0 4px;font-weight:800}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;
  display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
.modal{background:var(--card);border-radius:24px 24px 0 0;width:100%;max-width:500px;
  max-height:90vh;overflow-y:auto;padding:24px 20px calc(24px + env(safe-area-inset-bottom));
  animation:slideUp .3s;position:relative}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:-8px auto 16px}
.modal-title{font-size:18px;font-weight:800;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.modal-close{width:32px;height:32px;border:none;border-radius:50%;background:var(--bg);
  color:var(--text);font-size:16px;cursor:pointer}

/* ===== FORM ===== */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--text)}
.form-input,.form-select,.form-textarea{width:100%;padding:12px 14px;border:2px solid var(--border);
  border-radius:12px;background:var(--bg);color:var(--text);font-family:inherit;font-size:14px;transition:.2s}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--primary);background:var(--card)}
.form-textarea{resize:vertical;min-height:70px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row-3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
.form-actions{display:flex;gap:8px;margin-top:20px}
.form-actions .btn{flex:1}

/* ===== CHART ===== */
.chart-box{background:var(--card);border-radius:var(--radius);padding:16px;
  box-shadow:var(--shadow);margin-bottom:12px}
.chart-box h3{font-size:14px;font-weight:800;margin-bottom:12px}
.chart-wrap{position:relative;height:200px}

/* ===== TOAST ===== */
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:var(--text);
  color:var(--card);padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;
  z-index:9999;box-shadow:var(--shadow-lg);animation:toastIn .3s}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}

/* ===== PRINT ===== */
.print-area{display:none}
@media print{
  body>*{display:none!important}
  .print-area{display:block!important;padding:20px;font-family:'Cairo',sans-serif}
  .print-header{text-align:center;border-bottom:3px solid #10b981;padding-bottom:12px;margin-bottom:20px}
  .print-header h1{font-size:22px;color:#10b981}
  .print-table{width:100%;border-collapse:collapse;margin:16px 0}
  .print-table th,.print-table td{border:1px solid #ddd;padding:8px;text-align:right;font-size:13px}
  .print-table th{background:#f3f4f6;font-weight:700}
  .print-total{background:#10b981;color:#fff;font-weight:800;font-size:16px}
  .print-footer{text-align:center;margin-top:24px;color:#6b7280;font-size:12px}
}
</style>
</head>
<body>

<!-- التطبيق الرئيسي -->
<div id="app" class="app">
  <header class="header">
    <div class="header-inner">
      <div class="logo"><span class="logo-icon">💰</span><span class="logo-text">دفتر الديون <b>Pro</b></span></div>
      <div class="header-actions">
        <button class="icon-btn" id="themeBtn" title="الوضع الليلي">🌙</button>
      </div>
    </div>
  </header>
  <main id="mainContent" class="main"></main>
  <nav class="bottom-nav">
    <button class="nav-btn active" data-screen="dashboard"><span class="nav-icon">📊</span><span class="nav-label">الرئيسية</span></button>
    <button class="nav-btn" data-screen="customers"><span class="nav-icon">👥</span><span class="nav-label">الزبائن</span></button>
    <button class="nav-btn" data-screen="reminders"><span class="nav-icon">🔔</span><span class="nav-label">التنبيهات</span><span class="nav-badge hidden" id="reminderBadge">0</span></button>
    <button class="nav-btn" data-screen="backup"><span class="nav-icon">☁️</span><span class="nav-label">النسخ</span></button>
    <button class="nav-btn" data-screen="settings"><span class="nav-icon">⚙️</span><span class="nav-label">الإعدادات</span></button>
  </nav>
</div>

<div id="modalRoot"></div>
<div id="printArea" class="print-area"></div>

<script>
(function(){
'use strict';

const STORAGE_KEY = 'daftar_diyoun_pro_v1';
const USD = 'USD';
const LBP = 'LBP';

// إعدادات افتراضية (سعر الصرف الافتراضي 89500)
const defaultData = () => ({
  customers: [],
  settings: { exchangeRate: 89500, darkMode:false, reminderDays:3 }
});

let DB = loadDB();
let currentScreen = 'dashboard';
let currentCustomerId = null;
let searchQuery = '', filterCategory = 'all', sortBy = 'recent';
let dashChart = null, topChart = null;

function loadDB(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultData();
    const p = JSON.parse(raw);
    // في حال كان هناك إصدار قديم، نقوم بتحديث الإعدادات
    return { 
      customers:p.customers||[], 
      settings:{...defaultData().settings, ...(p.settings||{})} 
    };
  } catch(e){ return defaultData(); }
}
function saveDB(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function fmt(n){ return (Number(n)||0).toLocaleString('ar-EG',{maximumFractionDigits:2}); }
function rate(){ return Number(DB.settings.exchangeRate) || 89500; }

// دوال العملة
function getCurrencySymbol(curr) {
  return curr === USD ? '$' : 'ل.ل';
}
function fmtCurrency(amount, curr) {
  if(curr === USD) return '$' + fmt(amount);
  return fmt(amount) + ' ل.ل';
}
function toUSD(amount, curr) {
  return curr === LBP ? amount / rate() : amount;
}
function toLBP(amount, curr) {
  return curr === USD ? amount * rate() : amount;
}

// الحسابات
const debtTotal = d => Number(d.amount)||0;
const debtPaid  = d => Number(d.paid)||0;
const debtRemaining = d => Math.max(0, debtTotal(d)-debtPaid(d));
const debtIsPaid = d => debtRemaining(d) <= 0;
const debtIsOverdue = d => {
  if(debtIsPaid(d) || !d.dueDate) return false;
  return new Date(d.dueDate) < new Date(new Date().toDateString());
};
const debtIsUpcoming = (d, days) => {
  if(debtIsPaid(d) || !d.dueDate) return false;
  const diff = Math.ceil((new Date(d.dueDate) - new Date(new Date().toDateString()))/(86400000));
  return diff >= 0 && diff <= days;
};

// حسابات الزبون (تحويل الكل للدولار أو الليرة)
const customerRemainingUSD = c => c.debts.reduce((s,d)=>s+toUSD(debtRemaining(d), d.currency||USD),0);
const customerRemainingLBP = c => c.debts.reduce((s,d)=>s+toLBP(debtRemaining(d), d.currency||USD),0);

const customerTotalUSD     = c => c.debts.reduce((s,d)=>s+toUSD(debtTotal(d), d.currency||USD),0);
const customerTotalLBP     = c => c.debts.reduce((s,d)=>s+toLBP(debtTotal(d), d.currency||USD),0);

const customerPaidUSD      = c => c.debts.reduce((s,d)=>s+toUSD(debtPaid(d), d.currency||USD),0);
const customerPaidLBP      = c => c.debts.reduce((s,d)=>s+toLBP(debtPaid(d), d.currency||USD),0);

function allCustomers(){ return DB.customers.filter(c=>!c.archived); }
function findCustomer(id){ return DB.customers.find(c=>c.id===id); }

function reminderCount(){
  const days = DB.settings.reminderDays||3;
  let n = 0;
  allCustomers().forEach(c => c.debts.forEach(d => {
    if(debtIsOverdue(d) || debtIsUpcoming(d, days)) n++;
  }));
  return n;
}

function init(){
  applyTheme();
  attachGlobalEvents();
  render();
}

function applyTheme(){
  document.documentElement.setAttribute('data-theme', DB.settings.darkMode?'dark':'light');
  const btn = document.getElementById('themeBtn');
  if(btn) btn.textContent = DB.settings.darkMode?'☀️':'🌙';
}

function attachGlobalEvents(){
  document.querySelectorAll('.nav-btn').forEach(btn=>{
    btn.onclick = ()=>{ currentScreen = btn.dataset.screen; currentCustomerId=null; render(); };
  });
  document.getElementById('themeBtn').onclick = ()=>{
    DB.settings.darkMode = !DB.settings.darkMode; saveDB(); applyTheme();
  };
}

function setActiveNav(){
  document.querySelectorAll('.nav-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.screen===currentScreen && !currentCustomerId);
  });
  const n = reminderCount();
  const badge = document.getElementById('reminderBadge');
  if(n>0){ badge.textContent = n; badge.classList.remove('hidden'); }
  else badge.classList.add('hidden');
}

function render(){
  setActiveNav();
  const main = document.getElementById('mainContent');
  if(currentCustomerId) return renderCustomerDetail(main);
  switch(currentScreen){
    case 'dashboard': return renderDashboard(main);
    case 'customers': return renderCustomers(main);
    case 'reminders': return renderReminders(main);
    case 'backup': return renderBackup(main);
    case 'settings': return renderSettings(main);
  }
}

function renderDashboard(el){
  const cs = allCustomers();
  const totalRemainingUSD = cs.reduce((s,c)=>s+customerRemainingUSD(c),0);
  const totalRemainingLBP = cs.reduce((s,c)=>s+customerRemainingLBP(c),0);
  const totalPaidUSD      = cs.reduce((s,c)=>s+customerPaidUSD(c),0);
  const totalPaidLBP      = cs.reduce((s,c)=>s+customerPaidLBP(c),0);
  const totalAllUSD       = cs.reduce((s,c)=>s+customerTotalUSD(c),0);
  
  const overdueCount   = cs.reduce((s,c)=>s+c.debts.filter(debtIsOverdue).length,0);
  const activeCustomers= cs.filter(c=>customerRemainingUSD(c)>0 || customerRemainingLBP(c)>0).length;

  el.innerHTML = `
    <div class="screen">
      <div style="text-align:center; margin-bottom:12px; font-size:12px; color:var(--text-muted)">
        سعر الصرف المعتمد: 1$ = ${fmt(rate())} ل.ل
      </div>
      <div class="stat-grid">
        <div class="stat-card danger">
          <div class="stat-label">المتبقي (دولار)</div>
          <div class="stat-value danger">${fmtCurrency(totalRemainingUSD, USD)}</div>
          <div class="stat-sub">ما يعادل ${fmtCurrency(totalRemainingLBP, LBP)}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">إجمالي المسدد (دولار)</div>
          <div class="stat-value success">${fmtCurrency(totalPaidUSD, USD)}</div>
          <div class="stat-sub">ما يعادل ${fmtCurrency(totalPaidLBP, LBP)}</div>
        </div>
        <div class="stat-card warning">
          <div class="stat-label">ديون متأخرة</div>
          <div class="stat-value">${overdueCount}</div>
          <div class="stat-sub">تحتاج متابعة</div>
        </div>
        <div class="stat-card info">
          <div class="stat-label">الزبائن النشطين</div>
          <div class="stat-value">${activeCustomers}</div>
          <div class="stat-sub">من أصل ${cs.length} مسجلين</div>
        </div>
      </div>

      <div class="chart-box">
        <h3>توزيع المسدد مقابل المتبقي (بالدولار)</h3>
        <div class="chart-wrap"><canvas id="dashChart"></canvas></div>
      </div>

      <div class="chart-box">
        <h3>أعلى 5 زبائن بالديون (بالدولار)</h3>
        <div class="chart-wrap"><canvas id="topChart"></canvas></div>
      </div>

      <button class="btn btn-primary btn-block" id="quickAdd">➕ إضافة زبون جديد</button>
    </div>`;

  document.getElementById('quickAdd').onclick = ()=>openCustomerModal();

  if(dashChart) dashChart.destroy();
  const dctx = document.getElementById('dashChart');
  if(totalAllUSD>0){
    dashChart = new Chart(dctx, {
      type:'doughnut',
      data:{
        labels:['مسدد','متبقي'],
        datasets:[{data:[totalPaidUSD,totalRemainingUSD],
          backgroundColor:['#10b981','#ef4444'],borderWidth:0}]
      },
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{position:'bottom',labels:{font:{family:'Cairo'}}}}}
    });
  } else {
    dctx.parentElement.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:60px 0;font-size:13px">لا توجد بيانات بعد</p>';
  }

  if(topChart) topChart.destroy();
  const top = [...cs].map(c=>({name:c.name,val:customerRemainingUSD(c)}))
                     .filter(x=>x.val>0.01).sort((a,b)=>b.val-a.val).slice(0,5);
  const tctx = document.getElementById('topChart');
  if(top.length && tctx){

function exportData(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `daftar-diyoun-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast('✓ تم تصدير النسخة الاحتياطية');
}

function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if(!data.customers || !Array.isArray(data.customers)) throw new Error('ملف غير صالح');
      if(confirm('استيراد البيانات؟ سيتم استبدال البيانات الحالية.')){
        DB = { customers:data.customers, settings:{...defaultData().settings,...(data.settings||{})} };
        saveDB(); toast('✓ تم استيراد البيانات'); render();
      }
    } catch(err){ alert('ملف غير صالح: '+err.message); }
  };
  reader.readAsText(file);
  e.target.value='';
}

      </div>
      <div class="form-group">
        <label class="form-label">العملة</label>
        <select class="form-select" id="dCurr">
          <option value="USD" ${data.currency==='USD'?'selected':''}>دولار $</option>
          <option value="LBP" ${data.currency==='LBP'?'selected':''}>ليرة ل.ل</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">المدفوع</label>
        <input class="form-input" id="dPaid" type="number" step="0.01" min="0" value="${data.paid||0}" ${editing?'':'readonly'} placeholder="0">
      </div>
    </div>
    
    <div class="form-group">
      <label class="form-label">موعد الاستحقاق</label>
      <input class="form-input" id="dDue" type="date" value="${data.dueDate||''}">
    </div>
    <div class="form-group">
      <label class="form-label">ملاحظات</label>
      <textarea class="form-textarea" id="dNote" placeholder="اختياري">${escapeHtml(data.note||'')}</textarea>
    </div>
    <div class="form-actions">
      <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-primary" id="saveDebt">${editing?'حفظ':'إضافة'}</button>
    </div>
  `);

  document.getElementById('saveDebt').onclick = ()=>{
    const amount = parseFloat(document.getElementById('dAmount').value)||0;
    if(amount<=0) return alert('أدخل مبلغاً صحيحاً');
    const paid = editing ? (parseFloat(document.getElementById('dPaid').value)||0) : 0;
    const obj = {
      description: document.getElementById('dDesc').value.trim(),
      amount, 
      paid,
      currency: document.getElementById('dCurr').value,
      dueDate: document.getElementById('dDue').value || '',
      note: document.getElementById('dNote').value.trim()
    };
    if(editing){
      Object.assign(d, obj);
    } else {
      c.debts.push({ id:uid(), createdAt:Date.now(), payments:[], ...obj });
    }
    saveDB(); closeModal(); render(); toast(editing?'✓ تم التعديل':'✓ تمت إضافة الدين');
  };
}

function openPaymentModal(customerId, debtId){
  const c = findCustomer(customerId);
  const d = c.debts.find(x=>x.id===debtId);
  if(!d) return;
  const rem = debtRemaining(d);
  const curr = d.currency || USD;

  showModal('💵 تسجيل دفعة', `
    <div class="card" style="margin-bottom:16px;background:var(--bg);box-shadow:none">
      <div class="customer-meta" style="font-size:13px">
        <div>الدين: <b>${escapeHtml(d.description||'دين')}</b></div>
        <div>المتبقي: <b style="color:var(--danger)">${fmtCurrency(rem, curr)}</b></div>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">المبلغ (${getCurrencySymbol(curr)}) *</label>
      <input class="form-input" id="pAmount" type="number" step="0.01" min="0" max="${rem}" value="${rem}" autofocus>
    </div>
    <div class="form-group">
      <label class="form-label">ملاحظة</label>
      <input class="form-input" id="pNote" placeholder="اختياري">
    </div>
    <div class="form-actions">
      <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-primary" id="savePayment">✓ تسجيل</button>
    </div>
  `);

  document.getElementById('savePayment').onclick = ()=>{
    const amt = parseFloat(document.getElementById('pAmount').value)||0;
    if(amt<=0) return alert('أدخل مبلغاً صحيحاً');
    if(amt > rem + 0.001) return alert('المبلغ أكبر من المتبقي');
    d.paid = (Number(d.paid)||0) + amt;
    d.payments = d.payments || [];
    d.payments.push({ id:uid(), amount:amt, date:new Date().toISOString(), note:document.getElementById('pNote').value.trim() });
    saveDB(); closeModal(); render(); toast('✓ تم تسجيل الدفعة');
  };
}

function showModal(title, bodyHTML){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-handle"></div>
        <div class="modal-title">
          <span>${title}</span>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        ${bodyHTML}
      </div>
    </div>`;
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
  document.body.style.overflow = '';
}
window.closeModal = closeModal;

function sendWhatsApp(customerId){
  const c = findCustomer(customerId);
  if(!c) return;
  if(!c.phone){
    toast('⚠️ لا يوجد رقم هاتف مسجل لهذا الزبون');
    return;
  }
  
  let phone = c.phone.replace(/\D/g,''); 
  if(phone.startsWith('0')) { phone = '961' + phone.substring(1); } // كود لبنان 961
  
  const remUSD = customerRemainingUSD(c);
  const remLBP = customerRemainingLBP(c);
  const paidUSD = customerPaidUSD(c);
  const totalUSD = customerTotalUSD(c);
  
  let msg = `*كشف حساب - دفتر الديون* 💰\n\n`;
  msg += `مرحباً *${c.name}* 👋\n`;
  msg += `إليك تفاصيل حسابك بتاريخ: ${new Date().toLocaleDateString('ar-EG')}\n`;
  msg += `سعر الصرف المعتمد: 1$ = ${fmt(rate())} ل.ل\n\n`;
  
  if(c.debts.length === 0){
    msg += `لا توجد ديون مسجلة حالياً.`;
  } else {
    msg += `*تفاصيل الديون:*\n`;
    msg += `--------------------\n`;
    c.debts.forEach((d, i) => {
      const curr = d.currency || USD;
      msg += `${i+1}. ${d.description || 'دين'} (${getCurrencySymbol(curr)}):\n`;
      msg += `   الإجمالي: ${fmtCurrency(debtTotal(d), curr)}\n`;
      msg += `   المسدد: ${fmtCurrency(debtPaid(d), curr)}\n`;
      msg += `   *المتبقي: ${fmtCurrency(debtRemaining(d), curr)}*\n`;
      msg += `--------------------\n`;
    });
    msg += `\n📌 *إجمالي المتبقي:*\n`;
    msg += `بالدولار: *${fmtCurrency(remUSD, USD)}*\n`;
    msg += `بالليرة: *${fmtCurrency(remLBP, LBP)}*\n\n`;
    msg += `المجموع الكلي: ${fmtCurrency(totalUSD, USD)}\n`;
    msg += `إجمالي المسدد: ${fmtCurrency(paidUSD, USD)}\n\n`;
  }
  
  msg += `شكراً لتعاملك معنا! 🌹`;
  
  const url = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
}

function printStatement(customerId){
  const c = findCustomer(customerId);
  if(!c) return;
  const remUSD = customerRemainingUSD(c), remLBP = customerRemainingLBP(c);
  const paidUSD = customerPaidUSD(c), totalUSD = customerTotalUSD(c);
  
  const rows = c.debts.map(d=>{
    const curr = d.currency || USD;
    return `
    <tr>
      <td>${escapeHtml(d.description||'—')} (${getCurrencySymbol(curr)})</td>
      <td>${fmtCurrency(debtTotal(d), curr)}</td>
      <td>${fmtCurrency(debtPaid(d), curr)}</td>
      <td>${fmtCurrency(debtRemaining(d), curr)}</td>
      <td>${d.dueDate?new Date(d.dueDate).toLocaleDateString('ar-EG'):'—'}</td>
    </tr>`;
  }).join('');

  document.getElementById('printArea').innerHTML = `
    <div class="print-header">
      <h1>💰 كشف حساب</h1>
      <p style="color:#6b7280;font-size:13px">التاريخ: ${new Date().toLocaleDateString('ar-EG')}</p>
      <p style="color:#6b7280;font-size:12px">سعر الصرف: 1$ = ${fmt(rate())} ل.ل</p>
    </div>
    <div style="margin-bottom:16px">
      <p><b>الزبون:</b> ${escapeHtml(c.name)}</p>
      ${c.phone?`<p><b>الهاتف:</b> ${escapeHtml(c.phone)}</p>`:''}
    </div>
    <table class="print-table">
      <thead><tr><th>البيان</th><th>المبلغ</th><th>المسدد</th><th>المتبقي</th><th>الاستحقاق</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" style="text-align:center">لا توجد ديون</td></tr>'}</tbody>
      <tfoot>
        <tr class="print-total"><td>الإجمالي (بالدولار)</td><td>${fmtCurrency(totalUSD, USD)}</td><td>${fmtCurrency(paidUSD, USD)}</td><td>${fmtCurrency(remUSD, USD)}</td><td></td></tr>
        <tr class="print-total"><td>الإجمالي (بالليرة)</td><td colspan="3" style="text-align:center">${fmtCurrency(remLBP, LBP)} (المتبقي)</td><td></td></tr>
      </tfoot>
    </table>
    <div class="print-footer">
      تم إنشاء هذا الكشف بواسطة دفتر الديون Pro
    </div>`;

  window.print();
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
}
function toast(msg){
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 1800);
}

init();

})();
</script>
</body>
