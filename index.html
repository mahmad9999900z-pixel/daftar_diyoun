<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#10b981">
<title>دفتر الديون Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --primary:#10b981;--primary-dark:#059669;--primary-light:#d1fae5;
  --danger:#ef4444;--warning:#f59e0b;--info:#3b82f6;
  --bg:#f3f4f6;--card:#ffffff;--text:#1f2937;--text-muted:#6b7280;
  --border:#e5e7eb;--shadow:0 4px 20px rgba(0,0,0,.08);--shadow-lg:0 10px 40px rgba(0,0,0,.15);
  --radius:16px;--radius-sm:10px;
}
[data-theme="dark"]{
  --primary:#34d399;--primary-dark:#10b981;--primary-light:#064e3b;
  --bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--text-muted:#94a3b8;
  --border:#334155;--shadow:0 4px 20px rgba(0,0,0,.4);--shadow-lg:0 10px 40px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;transition:background .3s,color .3s;padding-bottom:88px}
.hidden{display:none!important}

/* ===== PIN ===== */
.pin-screen{position:fixed;inset:0;background:linear-gradient(135deg,#10b981,#059669);
  display:flex;align-items:center;justify-content:center;padding:20px;z-index:9999}
.pin-card{background:var(--card);border-radius:24px;padding:32px 24px;width:100%;max-width:360px;
  text-align:center;box-shadow:var(--shadow-lg)}
.pin-logo{font-size:56px;margin-bottom:8px}
.pin-card h1{font-size:22px;font-weight:800;margin-bottom:4px;color:var(--text)}
.pin-card p{color:var(--text-muted);font-size:14px;margin-bottom:20px}
.pin-dots{display:flex;justify-content:center;gap:12px;margin-bottom:24px}
.pin-dot{width:16px;height:16px;border-radius:50%;background:var(--border);transition:.2s}
.pin-dot.filled{background:var(--primary);transform:scale(1.15)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pin-key{aspect-ratio:1;border:none;border-radius:14px;background:var(--bg);color:var(--text);
  font-family:inherit;font-size:22px;font-weight:700;cursor:pointer;transition:.15s}
.pin-key:active{transform:scale(.92);background:var(--primary);color:#fff}
.pin-key.del{font-size:18px}
.pin-hint{margin-top:16px;font-size:12px;color:var(--text-muted)}
.pin-error{animation:shake .4s;border:2px solid var(--danger)!important}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ===== HEADER ===== */
.header{position:sticky;top:0;z-index:100;background:var(--card);
  box-shadow:0 2px 12px rgba(0,0,0,.06);padding:12px 16px}
.header-inner{display:flex;justify-content:space-between;align-items:center;max-width:900px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800}
.logo b{color:var(--primary)}
.logo-icon{font-size:24px}
.header-actions{display:flex;gap:8px}
.icon-btn{width:40px;height:40px;border:none;border-radius:12px;background:var(--bg);
  font-size:18px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center}
.icon-btn:active{transform:scale(.92)}

/* ===== MAIN ===== */
.main{max-width:900px;margin:0 auto;padding:16px}
.screen{animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== CARDS ===== */
.card{background:var(--card);border-radius:var(--radius);padding:16px;
  box-shadow:var(--shadow);margin-bottom:12px}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);
  position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--primary)}
.stat-card.danger::before{background:var(--danger)}
.stat-card.warning::before{background:var(--warning)}
.stat-card.info::before{background:var(--info)}
.stat-label{font-size:12px;color:var(--text-muted);margin-bottom:6px;font-weight:600}
.stat-value{font-size:20px;font-weight:800;color:var(--text)}
.stat-value.danger{color:var(--danger)}
.stat-value.success{color:var(--primary)}
.stat-sub{font-size:11px;color:var(--text-muted);margin-top:4px}

/* ===== SECTION HEADER ===== */
.section-header{display:flex;justify-content:space-between;align-items:center;
  margin:8px 0 12px;gap:8px}
.section-title{font-size:17px;font-weight:800}
.btn{border:none;border-radius:12px;padding:10px 16px;font-family:inherit;font-size:14px;
  font-weight:700;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;
  gap:6px;justify-content:center}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:var(--bg);color:var(--text)}
.btn-sm{padding:8px 12px;font-size:13px}
.btn-block{width:100%}
.btn-icon{width:36px;height:36px;padding:0;border-radius:10px}

/* ===== SEARCH / FILTER ===== */
.search-box{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.search-input{flex:1;min-width:200px;padding:12px 16px;border:2px solid var(--border);
  border-radius:12px;background:var(--card);color:var(--text);font-family:inherit;font-size:14px;
  transition:.2s}
.search-input:focus{outline:none;border-color:var(--primary)}
.chip{padding:8px 14px;border-radius:20px;border:2px solid var(--border);background:var(--card);
  color:var(--text-muted);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
  transition:.15s;white-space:nowrap}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ===== CUSTOMER CARD ===== */
.customer-card{background:var(--card);border-radius:var(--radius);padding:16px;
  box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer;transition:.15s;
  border:2px solid transparent;position:relative}
.customer-card:active{transform:scale(.99);border-color:var(--primary)}
.customer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.customer-name{font-weight:800;font-size:16px;color:var(--text);display:flex;align-items:center;
  gap:6px;flex-wrap:wrap}
.customer-amount{font-weight:800;font-size:16px;color:var(--danger);white-space:nowrap}
.customer-amount.paid{color:var(--primary)}
.customer-meta{display:flex;gap:12px;font-size:12px;color:var(--text-muted);margin-top:6px}
.customer-meta span{display:flex;align-items:center;gap:4px}

.badge{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700}
.badge-regular{background:#d1fae5;color:#059669}
.badge-late{background:#fef3c7;color:#d97706}
.badge-blacklist{background:#fee2e2;color:#dc2626}
.badge-overdue{background:#fee2e2;color:#dc2626}
.badge-paid{background:#d1fae5;color:#059669}
.badge-archived{background:#e5e7eb;color:#6b7280}
[data-theme="dark"] .badge-regular{background:#064e3b;color:#34d399}
[data-theme="dark"] .badge-late{background:#78350f;color:#fbbf24}
[data-theme="dark"] .badge-blacklist{background:#7f1d1d;color:#fca5a5}
[data-theme="dark"] .badge-overdue{background:#7f1d1d;color:#fca5a5}
[data-theme="dark"] .badge-paid{background:#064e3b;color:#34d399}
[data-theme="dark"] .badge-archived{background:#334155;color:#94a3b8}

/* ===== PROGRESS BAR ===== */
.progress{height:8px;background:var(--bg);border-radius:8px;overflow:hidden;margin-top:8px}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--primary),#34d399);
  border-radius:8px;transition:width .4s}

/* ===== DEBT ROW ===== */
.debt-item{background:var(--card);border-radius:var(--radius-sm);padding:14px;
  margin-bottom:10px;box-shadow:var(--shadow);border-right:4px solid var(--primary)}
.debt-item.overdue{border-right-color:var(--danger)}
.debt-item.paid{border-right-color:var(--text-muted);opacity:.7}
.debt-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.debt-desc{font-weight:700;font-size:14px;flex:1}
.debt-amount{font-weight:800;font-size:14px;color:var(--danger)}
.debt-item.paid .debt-amount{color:var(--primary)}
.debt-info{display:flex;gap:12px;font-size:12px;color:var(--text-muted);margin-bottom:8px;flex-wrap:wrap}
.debt-actions{display:flex;gap:6px;flex-wrap:wrap}

/* ===== EMPTY ===== */
.empty{text-align:center;padding:48px 20px;color:var(--text-muted)}
.empty-icon{font-size:56px;margin-bottom:12px;opacity:.6}
.empty h3{font-size:16px;margin-bottom:4px;color:var(--text)}
.empty p{font-size:13px}

/* ===== BOTTOM NAV ===== */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);
  box-shadow:0 -2px 20px rgba(0,0,0,.08);display:flex;justify-content:space-around;
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:100;max-width:100%}
.nav-btn{flex:1;border:none;background:none;color:var(--text-muted);padding:6px 4px;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-family:inherit;transition:.15s;position:relative;border-radius:10px}
.nav-btn.active{color:var(--primary)}
.nav-btn.active .nav-icon{transform:scale(1.15)}
.nav-icon{font-size:20px;transition:.15s}
.nav-label{font-size:10px;font-weight:700}
.nav-badge{position:absolute;top:2px;right:calc(50% - 20px);background:var(--danger);color:#fff;
  font-size:10px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;padding:0 4px;font-weight:800}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;
  display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
.modal{background:var(--card);border-radius:24px 24px 0 0;width:100%;max-width:500px;
  max-height:90vh;overflow-y:auto;padding:24px 20px calc(24px + env(safe-area-inset-bottom));
  animation:slideUp .3s;position:relative}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:-8px auto 16px}
.modal-title{font-size:18px;font-weight:800;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.modal-close{width:32px;height:32px;border:none;border-radius:50%;background:var(--bg);
  color:var(--text);font-size:16px;cursor:pointer}

/* ===== FORM ===== */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--text)}
.form-input,.form-select,.form-textarea{width:100%;padding:12px 14px;border:2px solid var(--border);
  border-radius:12px;background:var(--bg);color:var(--text);font-family:inherit;font-size:14px;transition:.2s}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--primary);background:var(--card)}
.form-textarea{resize:vertical;min-height:70px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-actions{display:flex;gap:8px;margin-top:20px}
.form-actions .btn{flex:1}

/* ===== CHART ===== */
.chart-box{background:var(--card);border-radius:var(--radius);padding:16px;
  box-shadow:var(--shadow);margin-bottom:12px}
.chart-box h3{font-size:14px;font-weight:800;margin-bottom:12px}
.chart-wrap{position:relative;height:200px}

/* ===== TOAST ===== */
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:var(--text);
  color:var(--card);padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;
  z-index:9999;box-shadow:var(--shadow-lg);animation:toastIn .3s}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}

/* ===== PRINT ===== */
.print-area{display:none}
@media print{
  body>*{display:none!important}
  .print-area{display:block!important;padding:20px;font-family:'Cairo',sans-serif}
  .print-header{text-align:center;border-bottom:3px solid #10b981;padding-bottom:12px;margin-bottom:20px}
  .print-header h1{font-size:22px;color:#10b981}
  .print-table{width:100%;border-collapse:collapse;margin:16px 0}
  .print-table th,.print-table td{border:1px solid #ddd;padding:8px;text-align:right;font-size:13px}
  .print-table th{background:#f3f4f6;font-weight:700}
  .print-total{background:#10b981;color:#fff;font-weight:800;font-size:16px}
  .print-footer{text-align:center;margin-top:24px;color:#6b7280;font-size:12px}
}
</style>
</head>
<body>

<!-- شاشة PIN -->
<div id="pinScreen" class="pin-screen">
  <div class="pin-card" id="pinCard">
    <div class="pin-logo">💰</div>
    <h1>دفتر الديون Pro</h1>
    <p>أدخل رمز الدخول للمتابعة</p>
    <div class="pin-dots" id="pinDots"></div>
    <div class="pin-pad" id="pinPad"></div>
    <p class="pin-hint">الرمز الافتراضي: <b>1234</b></p>
  </div>
</div>

<!-- التطبيق الرئيسي -->
<div id="app" class="app hidden">
  <header class="header">
    <div class="header-inner">
      <div class="logo"><span class="logo-icon">💰</span><span class="logo-text">دفتر الديون <b>Pro</b></span></div>
      <div class="header-actions">
        <button class="icon-btn" id="themeBtn" title="الوضع الليلي">🌙</button>
        <button class="icon-btn" id="lockBtn" title="قفل">🔒</button>
      </div>
    </div>
  </header>
  <main id="mainContent" class="main"></main>
  <nav class="bottom-nav">
    <button class="nav-btn active" data-screen="dashboard"><span class="nav-icon">📊</span><span class="nav-label">الرئيسية</span></button>
    <button class="nav-btn" data-screen="customers"><span class="nav-icon">👥</span><span class="nav-label">الزبائن</span></button>
    <button class="nav-btn" data-screen="reminders"><span class="nav-icon">🔔</span><span class="nav-label">التنبيهات</span><span class="nav-badge hidden" id="reminderBadge">0</span></button>
    <button class="nav-btn" data-screen="backup"><span class="nav-icon">☁️</span><span class="nav-label">النسخ</span></button>
    <button class="nav-btn" data-screen="settings"><span class="nav-icon">⚙️</span><span class="nav-label">الإعدادات</span></button>
  </nav>
</div>

<div id="modalRoot"></div>
<div id="printArea" class="print-area"></div>

<script>
(function(){
'use strict';

/* ============================================================
   البيانات (localStorage — بدون قاعدة بيانات)
   ============================================================ */
const STORAGE_KEY = 'daftar_diyoun_pro_v1';
const defaultData = () => ({
  customers: [],
  settings: { currency:'د.ل', pin:'1234', darkMode:false, reminderDays:3 }
});

let DB = loadDB();
let currentScreen = 'dashboard';
let currentCustomerId = null;
let searchQuery = '', filterCategory = 'all', sortBy = 'recent';
let dashChart = null, topChart = null;
let pinned = true, pinBuf = '';

function loadDB(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultData();
    const p = JSON.parse(raw);
    return { customers:p.customers||[], settings:{...defaultData().settings,...(p.settings||{})} };
  } catch(e){ return defaultData(); }
}
function saveDB(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function fmt(n){ return (Number(n)||0).toLocaleString('ar-EG',{maximumFractionDigits:2}); }
function cur(){ return DB.settings.currency||'د.ل'; }

/* ============================================================
   الحسابات
   ============================================================ */
const debtTotal = d => Number(d.amount)||0;
const debtPaid  = d => Number(d.paid)||0;
const debtRemaining = d => Math.max(0, debtTotal(d)-debtPaid(d));
const debtIsPaid = d => debtRemaining(d) <= 0;
const debtIsOverdue = d => {
  if(debtIsPaid(d) || !d.dueDate) return false;
  return new Date(d.dueDate) < new Date(new Date().toDateString());
};
const debtIsUpcoming = (d, days) => {
  if(debtIsPaid(d) || !d.dueDate) return false;
  const diff = Math.ceil((new Date(d.dueDate) - new Date(new Date().toDateString()))/(86400000));
  return diff >= 0 && diff <= days;
};
const customerRemaining = c => c.debts.reduce((s,d)=>s+debtRemaining(d),0);
const customerTotal     = c => c.debts.reduce((s,d)=>s+debtTotal(d),0);
const customerPaid      = c => c.debts.reduce((s,d)=>s+debtPaid(d),0);

function allCustomers(){ return DB.customers.filter(c=>!c.archived); }
function findCustomer(id){ return DB.customers.find(c=>c.id===id); }

function reminderCount(){
  const days = DB.settings.reminderDays||3;
  let n = 0;
  allCustomers().forEach(c => c.debts.forEach(d => {
    if(debtIsOverdue(d) || debtIsUpcoming(d, days)) n++;
  }));
  return n;
}

/* ============================================================
   التهيئة
   ============================================================ */
function init(){
  applyTheme();
  buildPinPad();
  attachGlobalEvents();
  if(!DB.settings.pin){ DB.settings.pin='1234'; saveDB(); }
  showPin();
}

function applyTheme(){
  document.documentElement.setAttribute('data-theme', DB.settings.darkMode?'dark':'light');
  const btn = document.getElementById('themeBtn');
  if(btn) btn.textContent = DB.settings.darkMode?'☀️':'🌙';
}

/* ============================================================
   PIN
   ============================================================ */
function buildPinPad(){
  const pad = document.getElementById('pinPad');
  pad.innerHTML = '';
  ['1','2','3','4','5','6','7','8','9','C','0','⌫'].forEach(k=>{
    const b = document.createElement('button');
    b.className = 'pin-key' + (k==='⌫'?' del':'');
    b.textContent = k;
    b.onclick = ()=>{ if(k==='C'){ pinBuf=''; } else if(k==='⌫'){ pinBuf=pinBuf.slice(0,-1); } else if(pinBuf.length<4){ pinBuf+=k; } renderPinDots(); checkPin(); };
    pad.appendChild(b);
  });
  renderPinDots();
}
function renderPinDots(){
  const dots = document.getElementById('pinDots');
  dots.innerHTML = '';
  for(let i=0;i<4;i++){
    const d = document.createElement('div');
    d.className = 'pin-dot' + (i<pinBuf.length?' filled':'');
    dots.appendChild(d);
  }
}
function checkPin(){
  if(pinBuf.length!==4) return;
  if(pinBuf === DB.settings.pin){ unlockApp(); }
  else {
    const card = document.getElementById('pinCard');
    card.classList.add('pin-error');
    setTimeout(()=>{ card.classList.remove('pin-error'); pinBuf=''; renderPinDots(); }, 500);
  }
}
function showPin(){
  pinned = true;
  document.getElementById('pinScreen').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
  pinBuf = ''; renderPinDots();
}
function unlockApp(){
  pinned = false;
  document.getElementById('pinScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  pinBuf = '';
  render();
}

/* ============================================================
   التنقل والأحداث
   ============================================================ */
function attachGlobalEvents(){
  document.querySelectorAll('.nav-btn').forEach(btn=>{
    btn.onclick = ()=>{ currentScreen = btn.dataset.screen; currentCustomerId=null; render(); };
  });
  document.getElementById('themeBtn').onclick = ()=>{
    DB.settings.darkMode = !DB.settings.darkMode; saveDB(); applyTheme();
  };
  document.getElementById('lockBtn').onclick = showPin;
}

function setActiveNav(){
  document.querySelectorAll('.nav-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.screen===currentScreen && !currentCustomerId);
  });
  const n = reminderCount();
  const badge = document.getElementById('reminderBadge');
  if(n>0){ badge.textContent = n; badge.classList.remove('hidden'); }
  else badge.classList.add('hidden');
}

function render(){
  setActiveNav();
  const main = document.getElementById('mainContent');
  if(currentCustomerId) return renderCustomerDetail(main);
